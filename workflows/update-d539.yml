name: Update d539 data

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 21:15 (UTC 13:15) 首次嘗試，距開獎 45 分鐘，資料源通常已更新
    - cron: '15 13 * * 1-6'
    # 台灣時間 22:00 (UTC 14:00) 備用，確保第一次沒抓到時補跑
    - cron: '0 14 * * 1-6'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update latest d539 JSON
        run: node ./scripts/update-d539-latest.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/d539-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update latest d539 data"
          git push
